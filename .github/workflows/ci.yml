name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ci-web.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 128575200416-ciandroid.apps.googleusercontent.com
  EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 128575200416-ciios.apps.googleusercontent.com

jobs:
  quality:
    name: Typecheck & Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor

  bundle:
    name: Web bundle export
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web bundle
        run: npm run export:web

      - name: Upload web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export-${{ github.sha }}
          path: dist-web
          retention-days: 7
          if-no-files-found: error
