name: EAS Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: EAS submit profile
        required: true
        type: choice
        default: production
        options:
          - production

jobs:
  submit:
    name: Submit to store
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit latest build
        run: eas submit --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --latest --non-interactive
