name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: preview
        options:
          - development
          - preview
          - production

  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ github.event_name == 'push' && 'production / all' || format('{0} / {1}', inputs.profile, inputs.platform) }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS (manual)
        if: github.event_name == 'workflow_dispatch'
        run: eas build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --no-wait

      - name: Build on EAS (release tag)
        if: github.event_name == 'push'
        run: eas build --profile production --platform all --non-interactive --no-wait
