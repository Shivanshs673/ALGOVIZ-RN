name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform (iOS requires Apple credentials set up locally first)
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: preview
        options:
          - development
          - preview
          - production

  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: eas-build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Android (${{ github.event_name == 'push' && 'production' || inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'android' ||
      inputs.platform == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (manual)
        if: github.event_name == 'workflow_dispatch'
        run: eas build --profile ${{ inputs.profile }} --platform android --non-interactive --no-wait

      - name: Build Android (release tag)
        if: github.event_name == 'push'
        run: eas build --profile production --platform android --non-interactive --no-wait

  build-ios:
    name: iOS (${{ github.event_name == 'push' && 'production' || inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.platform == 'ios' || inputs.platform == 'all')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: eas build --profile ${{ inputs.profile }} --platform ios --non-interactive --no-wait
